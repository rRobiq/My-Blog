{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ post.title }}</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>
    <h1>{{ post.title }}</h1>
    <p>Posted on {{ post.post_date }}</p>
    {% if post.image %}
    <img src="{{ post.image.url }}" alt="{{ post.title }}">
    {% endif %}
    <p>{{ post.paragraph }}</p>
    <p>{{ post.more_details_for_the_dedicated_page }}</p>
<h2><a href="{% url 'index' %}">Return</a></h2>
</body>
</html>
