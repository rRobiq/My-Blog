{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Form</title>
  <link rel="stylesheet" href="{% static 'form.css' %}" />
</head>
<body>

<h1>Form</h1>

<form onsubmit="return validateForm()">
  <p>
    <label for="gender">Gender:</label>
    <select id="gender" name="gender">
      <option value="" disabled selected>-Select-</option>
      <option value="Male">Male</option>
      <option value="Female">Female</option>
      <option value="Other">Other</option>
    </select>
  </p>

  <p>
    <label for="first-name">First Name:</label>
    <input type="text" id="first-name" name="first-name" />
  </p>

  <p>
    <label for="last-name">Last Name:</label>
    <input type="text" id="last-name" name="last-name" />
  </p>

  <p>Relationship status:
    <label><input type="radio" name="relationship" value="In a relationship" /> In a relationship</label>
    <label><input type="radio" name="relationship" value="Single" /> Single</label>
  </p>

  <p>
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" />
  </p>

  <p>
    <label for="birthDate">Date of Birth:</label>
    <input type="date" id="birthDate" name="birthDate" />
  </p>

  <p>
    <label for="address">Write something interesting about you:</label><br />
    <textarea id="address" name="address" cols="30" rows="2"></textarea>
  </p>

  <p>Interest:
    <br /><label><input type="checkbox" name="interest" value="Music" /> Music</label>
    <br /><label><input type="checkbox" name="interest" value="Sport" /> Sport</label>
    <br /><label><input type="checkbox" name="interest" value="Travel" /> Travel</label>
  </p>

  <p>
    <label for="file">Profile picture:</label>
    <input type="file" id="file" name="file" />
  </p>

  <p>
    <input type="submit" value="Submit" />
  </p>
</form>

<a href="{% url 'index' %}">Return</a>

<script src="{% static 'form.js' %}"></script>
</body>
</html>
